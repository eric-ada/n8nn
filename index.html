<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷選單</title>
    <style>
        /* Basic Reset & Layout Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* Button Group Wrapper */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between buttons */
        }

        /* Individual Button Styling */
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            color: #ffffff;
            background-color: #007bff;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.2);
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Different color accents for variety (Optional) */
        .btn-settings { background-color: #34495e; box-shadow: 0 2px 5px rgba(52, 73, 94, 0.2); }
        .btn-settings:hover { background-color: #2c3e50; }

        .btn-test { background-color: #27ae60; box-shadow: 0 2px 5px rgba(39, 174, 96, 0.2); }
        .btn-test:hover { background-color: #219653; }

        .btn-sync { background-color: #2980b9; box-shadow: 0 2px 5px rgba(41, 128, 185, 0.2); }
        .btn-sync:hover { background-color: #2471a3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>快捷操作選單</h1>
        <div class="button-group">
            <!-- 設定 Button -->
            <a href="https://docs.google.com/spreadsheets/d/1crjPqNh3Jc-CTV6FOK4FZLyf7-UEGgt56pjX9wk2kcE/edit?usp=drive_link" 
               class="btn btn-settings" 
               target="_blank" 
               rel="noopener noreferrer">設定</a>

            <!-- 測試 Button -->
            <a href="https://eric-ada.github.io/n8nn/off_days_viewer.html" 
               class="btn btn-test" 
               target="_blank" 
               rel="noopener noreferrer">測試</a>

            <!-- 同步 Button -->
            <a href="https://overfull-tribune-ream.ngrok-free.dev/form-test/e16c5e87-8cee-4fda-92f8-d2f31b01df0e" 
               class="btn btn-sync" 
               target="_blank" 
               rel="noopener noreferrer">同步</a>
        </div>
    </div>

</body>
</html>
